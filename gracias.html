<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gracias — Cuando Dios se siente lejos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0e0c09;
        color: #f5f0e8;
        font-family: 'Inter', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        text-align: center;
      }
      .label {
        font-size: 10px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #c9a96e;
        margin-bottom: 28px;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(26px, 6vw, 38px);
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 16px;
      }
      .sub {
        font-size: 15px;
        color: rgba(245,240,232,0.55);
        line-height: 1.6;
        margin-bottom: 36px;
      }
      .sub a {
        color: #c9a96e;
        text-decoration: none;
      }
      .btn {
        display: block;
        background: #c9a96e;
        color: #000;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        padding: 18px 24px;
        text-decoration: none;
        margin-bottom: 16px;
      }
      .btn:active { opacity: 0.85; }
      .note {
        font-size: 12px;
        color: rgba(245,240,232,0.3);
        line-height: 1.6;
      }
      .divider {
        border: none;
        border-top: 1px solid rgba(201,169,110,0.12);
        margin: 32px 0;
      }
      .author {
        font-size: 13px;
        color: rgba(245,240,232,0.4);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="label">✦ &nbsp; Gracias por tu confianza &nbsp; ✦</div>
      <h1>Tu devocional<br>está listo.</h1>
      <p class="sub">
        Stripe te ha enviado el recibo a tu correo.<br>
        El enlace de descarga también está ahí,<br>por si lo necesitas más adelante.
      </p>
      <a
        href="https://drive.google.com/uc?export=download&id=19UPlGJ_b6AcsBH7Rb3msWoh4AriPZ6I9"
        class="btn"
        download
      >
        ↓ &nbsp; Descargar el devocional
      </a>
      <p class="note">Formato PDF · 7 días · 5 minutos al día</p>
      <hr class="divider" />
      <p class="author">Que estos 7 días te acerquen a Él. — Joel</p>
    </div>
  </body>
</html>
